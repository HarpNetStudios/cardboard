nodebug [
    defsvar MA_CloudBox ""

    defvar MA_CloudboxColorR 0 0  255
    defvar MA_CloudboxColorG 0 0  255 //  0  0xFFFFFF
    defvar MA_CloudboxColorB 0 0  255
    defvar MA_CloudboxAlpha  0 0  255 //    0.0    1.0
    defvar MA_CloudClip      0 0 1000 //    0.0    1.0
    defvar MA_SpinClouds -7200 0 7200 // -720.0  720.0

    defvar MA_CloudboxListLen    0  0 256
    defvar MA_NumOfCloudboxRows  1 15   0
