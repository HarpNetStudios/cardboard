    CloudboxList = ""
    ComboList    = ""
]
CloudboxList = [
    ""
    "skyboxes/lordkv/saturn"
]

MAP__SkyCloudbox = [
    guilist [// H
        if $MA_Cloudbox_ShowSkies [
            loop iCol (ceil (divf $MA_CloudboxListLen $MA_NumOfCloudboxRows)) [
                guilist [// V
                    guistrut 24 1
                    loopsublist iSky $ComboList (* $iCol $MA_NumOfCloudboxRows) $MA_NumOfCloudboxRows [
                        if (! $iSky) [
                            guibutton (concatword (? (=s $cloudbox $iSky) "^f8" "^f9") "*no_cloudbox*") [cloudbox ""]
                        ][
                            guibutton (concatword (? (=s $cloudbox $iSky) "^f8" ) $iSky) (concat cloudbox $iSky)
                        ]
                    ]
                ]
            ]
        ][
            loop iCol (ceil (divf $MA_CloudboxListLen $MA_NumOfCloudboxRows)) [
                guilist [// V
                    guistrut 24 1
                    loopsublist iSky $CloudboxList (* $iCol $MA_NumOfCloudboxRows) $MA_NumOfCloudboxRows [
                        if (! $iSky) [
                            guibutton (concatword (? (=s $cloudbox $iSky) "^f8" "^f9") "*no_cloudbox*") [cloudbox ""]
                        ][
                            guibutton (concatword (? (=s $cloudbox $iSky) "^f8" ) $iSky) (concat cloudbox $iSky)
                        ]
                    ]
                ]
            ]
        ]
        guispring
        guibar
        guilist [// V
            MA_Skybox = (checkrolloveraction "cloudbox " [if (> $numargs 0) [result $arg1] [at $guirolloveraction 1]])
            guiimage (concatword "<thumbnail:256>packages/" $MA_Skybox "_ft") (checkrolloveraction "cloudbox ") 6 0 "data/cardboard_missing.png" ""
            guibar
            guialign 0 [guitext (concatword "^f7cloudbox: ^f~^"" (chopstr $cloudbox -16 "..") "^"")]
            guistrut 0.25
            guialign 0 [
                guicheckbox "show skyboxes " MA_Cloudbox_ShowSkies 1 0 [
                    ComboList = (concat $CloudboxList $SkyboxList)
                    MA_CloudboxListLen (listlen $CloudboxList)
                ]
            ]
        ]
    ]
    //=========================================================================================================================
    guitab "parameters"
    guialign 0 [// H
        guilist [// V
            guilist [// H
                guilist [// V
                    guistrut 8 1
                    guialign 1 [guitext "color: "]
                    guistrut 1
                    guialign 1 [guicolor $cloudboxcolor; guistrut 1]
                    guistrut 0.5
                    guialign 1 [guitext "alpha: "]
                ]
                guilist [// V
                    guistrut 64 1
                    MA_CloudboxColorR (& (>> $cloudboxcolor 16) 0xFF)
                    MA_CloudboxColorG (& (>> $cloudboxcolor  8) 0xFF)
                    MA_CloudboxColorB (&     $cloudboxcolor     0xFF)
                    guislider MA_CloudboxColorR 0 255 [cloudboxcolor $MA_CloudboxColorR $MA_CloudboxColorG $MA_CloudboxColorB]
                    guislider MA_CloudboxColorG 0 255 [cloudboxcolor $MA_CloudboxColorR $MA_CloudboxColorG $MA_CloudboxColorB]
                    guislider MA_CloudboxColorB 0 255 [cloudboxcolor $MA_CloudboxColorR $MA_CloudboxColorG $MA_CloudboxColorB]
                    guistrut 0.5
                    MA_CloudboxAlpha (*f $cloudboxalpha 255)
                    guislider MA_CloudboxAlpha 0 255 [cloudboxalpha (*f $MA_CloudboxAlpha (divf 1 255))]
                ]
            ]
            guistrut 1
            guilist [// H
                guilist [// V
                    guistrut 8 1
                    guialign 1 [guitext "clip: "]
                    guistrut 0.5
                    guialign 1 [guitext "spin: "]
                    guistrut 0.5
                    guialign 1 [guitext "yaw: "]
                ]
                guilist [// V
                    guistrut 64 1
                    MA_CloudClip (*f $cloudclip 1000)
                    guislider MA_CloudClip 0 1000 [cloudclip (*f $MA_CloudClip 0.001)]
                    guistrut 0.5
                    MA_SpinSky (*f $spinclouds 10)
                    guislider MA_SpinSky -200 200 [spinclouds (*f $MA_SpinSky 0.1)]
                    guistrut 0.5
                    guislider yawclouds
                ]
            ]
        ]
    ]
]

