nodebug [
	defvar  EDT_Width  1 83 0 // in units of (fontscale Width )
	defvar  EDT_Height 1 23 0 // in units of (fontscale Height)
]

newgui "editing" [
	guiscale 0.7
	guikeeptab 1
	guinoautotab [
		// Save the frames 'guitabnum' hack:             H                                 V
							   if (= $guitabnum 1) [ guilist [guistrut $EDT_Height 1; guilist [guistrut $EDT_Width 1; EDT__Editing      ]] ]
		guitab "texture"     ; if (= $guitabnum 2) [ guilist [guistrut $EDT_Height 1; guilist [guistrut $EDT_Width 1; EDT__Texture      ]] ]
		guitab "entity"      ; if (= $guitabnum 3) [ guilist [guistrut $EDT_Height 1; guilist [guistrut $EDT_Width 1; EDT__Entities     ]] ]
		guitab "height/blend"; if (= $guitabnum 4) [ guilist [guistrut $EDT_Height 1; guilist [guistrut $EDT_Width 1; EDT__Height_Blend ]] ]
        guitab "adjustments" ; if (= $guitabnum 5) [ guilist [guistrut $EDT_Height 1; guilist [guistrut $EDT_Width 1; EDT__Adjustments  ]] ]
        guitab "waypoints"   ; if (= $guitabnum 6) [ guilist [guistrut $EDT_Height 1; guilist [guistrut $EDT_Width 1; EDT__Waypoints    ]] ]
		guitab "map"         ; if (= $guitabnum 7) [ guilist [guistrut $EDT_Height 1; guilist [guistrut $EDT_Width 1; EDT__Map          ]] ]
		guitab "map.cfg"     ; if (= $guitabnum 8) [ guilist [guistrut $EDT_Height 1; guilist [guistrut $EDT_Width 1; EDT__Cfg          ]] ]
	]
] "editing"


//#############################################################################################################################################
//#############################################################################################################################################
EDT__Editing = [
	guibutton "toggle edit mode^t^t^f2[RALT]"  [edittoggle]
	guibar //-------------------------------------------------------------------------
	guilist [// H
		guilist [// V
			guistrut 41.5 1
			guitext "select^t^t^t^t^f2[MouseLeft ^f6drag^f2]"
			guitext "extend selection^t^t^f2[MouseRight]"
			guitext "move selection^t^t^t^f2[MouseRight ^f6drag^f2]"
			guitext "deselect^t^t^t^t^f2[SPACE]"
			guitext "select all ents in box^t^f2[NumPad-ENTER]"
		]
		guilist [// V
			guitext "select corners^t^t^t^f2[MouseMiddle ^f6drag^f2]"
			guitext "reorient selection^t^t^f2[MouseRight]"
			guitext "passthrough^t^t^t^f2[LCTRL ^f6hold^f2]"
			guitext "center view on ent^t^t^f2[, + MouseWheel]"
			guitext "select all matching ents^t^f2[N]"
		]
	]
	guibar //-------------------------------------------------------------------------
	guilist [// H
		guilist [// V
			guistrut 41.5 1
			guitext "push/pull selection^t^t^f2[MouseWheel]"
			guitext "change gridsize^t^t^t^f2[G + MouseWheel]"
			guitext "flip on selected axis^t^t^f2[X]"
		]
		guilist [// V
			guitext "push cube face^t^t^t^f2[F + MouseWheel]"
			guitext "push corner^t^t^t^f2[Q + MouseWheel]"
			guitext "rotate^t^t^t^t^f2[R + MouseWheel]"
		]
	]
	guibar //-------------------------------------------------------------------------
	guilist [// H
		guilist [// V
			guistrut 41.5 1
			guitext "copy^t^t^t^t^t^f2[C]"
			guitext "delete^t^t^t^t^f2[Delete]"
		]
		guilist [// V
			guitext "paste^t^t^t^t^f2[V]"
		]
	]
	guibar //-------------------------------------------------------------------------
	guilist [// H
		guilist [// V
			guistrut 41.5 1
			guitext "undo^t^t^t^t^t^f2[U] [Z]"
		]
		guilist [// V
			guitext "redo^t^t^t^t^t^f2[I]"
		]
	]
	guilist [// H
		guilist [// V
			guistrut 12 1
			guitext "undo size:"
		]
		guilist [// V
			guistrut 71 1
			guilistslider undomegs [1 2 4 6 8 10 20 30 40 60 80 120 160 200 240 320 400 480 560 640 720 800 880 960 1000]
			guilist [// H
				guitext "^f9(in megabytes)"
				guispring
				guitext "^f9(default 8)"
			]
		]
	]
	guibar //-------------------------------------------------------------------------
	guilist [// H
		guilist [// V
			guistrut 41.5 1
			guibutton "cube material volumes^t^f2/materialgui"  [showgui "editmat"] "menu"
			if $editing [
                guibutton "prefab browser^t^t^t^f2[Insert]"     [showgui "prefabs"] "menu"
            ][
                guibutton "^f4prefab browser^t^t^t^f2[Insert]"  [showgui "prefabs"] "menu"
            ]
		]
		guilist [// V
			guistrut 1
			guibutton "mapmodel browser^t^t^f2[F3]"             [showgui "mapmodels"]   "menu"
		]
	]
	guibar //-------------------------------------------------------------------------
    guilist [// H
        guilist [// V
            guistrut 41.5 1
            guicheckbox "toggle outline^t^t^t^f2[7]"            outline
        ]
        guilist [// V
            guicheckbox "toggle wireframe"                      wireframe
        ]
    ]
]

//#############################################################################################################################################

EDT__Texture = [
	guistrut 0.25
	guilist [// H
		guilist [// V
			guistrut 12 1
		]
		guilist [
			guistrut 28 1
			guifreerow 22 -2 [ guitext "change texture"
					 ]  6 -2 [ guitext "^f2[Y + MouseWheel]"
			]
			guifreerow 22 -2 [ guibutton "texture browser" [showtexgui]
					 ]  6 -2 [ guitext "^f2[F2]"
			]
			guistrut 0.5
			guifreerow 22 -2 [ guicheckbox "texture all faces" allfaces
					 ]  6 -2 [ guitext "^f2[6]"
			]
		]
	]
	guistrut 0.5
	guibar //-------------------------------------------------------------------------
	guistrut 0.35
	guifreerow 12 -2 [
			 ] 22 -2 [ guibutton "texture slot manager" [showgui "texslotmanager"]
			 ]  6 -2 [ guitext "^f2[F9]"
			 ]  0 -2 [ guitext "^f2/toggletexman"
	]
	guistrut 0.5
	guibar //-------------------------------------------------------------------------
	guistrut 0.25
	guilist [// H
		guilist [// V
			guistrut 12 1
			guialign 1 [// H
				guitext "parameters: "
			]
		]
		guilist [// V
			guistrut 28 1
			guifreerow 22 -2 [ guitext "offset by 8px on X"
					 ] 20 -2 [ guitext "^f2[1 + MouseWheel]"
					 ]  0 -2 [ guitext "^f~offset by 1px^t^f2[+ALT]"
			]
			guifreerow 22 -2 [ guitext "offset by 8px on Y"
					 ] 20 -2 [ guitext "^f2[2 + MouseWheel]"
					 ]  0 -2 [ guitext "^f~offset by 1px^t^f2[+ALT]"
			]
			guistrut 0.25
			guifreerow 22 -2 [ guitext "rotate-by-90 and/or flip"
					 ] 20 -2 [ guitext "^f2[3 + MouseWheel]"
			]
			guistrut 0.25
			guifreerow 22 -2 [ guitext "scale half/double"
					 ] 20 -2 [ guitext "^f2[4 + MouseWheel]"
					 ]  0 -2 [ guitext "^f~ -/+ by 1/16^t^f2[+ALT]"  // 1/16 = 0.0625
			]
			guistrut 1
			guifreerow 22 -2 [ guibutton "color editor" [showgui "vcolor"]
					 ]  6 -2 [ guitext "^f2[F7]"
					 ]  0 -2 [ guitext "^f2/vcolorgui"
			]
			guistrut 0.25
			guifreerow 22 -2 [ guibutton "shaderparam editor" [showgui "vshaderparam"]
					 ]  6 -2 [ guitext "^f2[F8]"
					 ]  0 -2 [ guitext "^f2/vshaderparamgui"
			]
			guistrut 1
			guifreerow 22 -2 [ guibutton "reset all parameters" [vreset]
					 ] 20 -2 [ guitext "^f2/vreset"
			]
		]
	]
	guistrut 0.5
    guibar //-------------------------------------------------------------------------
    guistrut 0.35
    guifreerow 12 -2 [
             ] 22 -2 [ guibutton "texture slot manager" [showgui "texslotmanager"]
             ]  6 -2 [ guitext "^f2[F9]"
             ]  0 -2 [ guitext "^f2/toggletexman"
    ]
]


//#############################################################################################################################################
EDT__Entities = [
	guistrut 0.35
    guilist [// H
        guistrut 12
        guilist [// V
            guistrut 28 1
            guibutton "create new entity^t^f2/newentgui" [showgui "newent"]
        ]
    ]
    guistrut 0.5
    guibar //-------------------------------------------------------------------------
    guistrut 0.25
	guilist [// H
		guistrut 12
		guilist [// V
			guistrut 28 1
			guicheckbox "entity selection^t^t^f2[8]"     myentediting //entediting
			guicheckbox "entity snap-to-grid^t^f2[9]"  entselsnap
		]
		guilist [
			guicheckbox "new entities take yaw from camera  ^f2[0]"  entcamdir
		]
	]
	guistrut 1
	guilist [// H
		guilist [// V
			guistrut 12 1
			guialign 1 [// H
				guitext "entdrop: "
			]
		]
		guilist [// V
			guistrut 28 1
			guiradio "^f9(2) ^f~at selection"                       entdrop 2
			guiradio "^f9(3) ^f~at selection, to the floor"         entdrop 3
		]
		guilist [// V
			guiradio "^f9(0) ^f~at current position"                entdrop 0
			guiradio "^f9(1) ^f~at current position, to the floor"  entdrop 1
		]
	]
	guistrut 0.5
	guibar //-------------------------------------------------------------------------
	guistrut 0.25
	guilist [// H
		guilist [// V
			guistrut 12 1
			guialign 1 [// H
				guitext "attributes: "
			]
		]
		guilist [// V
			guistrut 28 1
			guitext "attr1 -/+ by 1 ^t^t^f2[1 + MouseWheel]^t^t^f~-/+ by 10 ^f2[+ALT]"
            guitext "attr2 -/+ by 1 ^t^t^f2[2 + MouseWheel]^t^t^f~-/+ by 10 ^f2[+ALT]"
            guitext "attr3 -/+ by 1 ^t^t^f2[3 + MouseWheel]^t^t^f~-/+ by 10 ^f2[+ALT]"
            guitext "attr4 -/+ by 1 ^t^t^f2[4 + MouseWheel]^t^t^f~-/+ by 10 ^f2[+ALT]"
            guitext "attr5 -/+ by 1 ^t^t^f2[5 + MouseWheel]^t^t^f~-/+ by 10 ^f2[+ALT]"
		]
	]
	guistrut 1
	guilist [// H
		guistrut 12
		guilist [// V
			guistrut 28 1
			guibutton "edit selected entity  ^f2[F3]"  showentgui
		]
		guilist [// V
			guibutton "edit selected entity in console  ^f2[.]"  selentedit
		]
	]
	guistrut 0.5
    guibar //-------------------------------------------------------------------------
    guistrut 0.35
    guilist [// H
        guilist [// V
            guistrut 12 1
        ]
        guilist [// V
            guistrut 28 1
            guibutton "entity manager ^t^f2[F10]  /toggleentman"    [showgui "entitymanager"]
        ]
    ]
]

//#############################################################################################################################################
EDT__Height_Blend = [
	guialign 0 [// H
		guilist [// V
			guititle "heightmap"
			guilist [// H
				guilist [// V
					guistrut 38 1
					guitext "toggle heightmap mode^t^f2[H]"
					guitext "push/pull heightmap^t^t^f2[MouseWheel]"
				]
				guilist [// V
					guistrut 38 1
					guistrut 1
					guitext "select heightmap brush^t^f2[B + MouseWheel]"
				]
			]
		]
	]
	guistrut 1
	guibar //-------------------------------------------------------------------------
	guialign 0 [// H
		guilist [// V
			guititle "blendmap"
			guilist [// H
				guilist [// V
					guistrut 38 1
					guitext "paint mode:"
					guilist [// H
						guistrut 4
						guilist [// V
							guiradio (concatword "^f9(0)^f~ " (at $Labels_BlendPaintMode 0) "^t^t^f2[NumPad 0]")  blendpaintmode 0
							guiradio (concatword "^f9(2)^f~ " (at $Labels_BlendPaintMode 2) "^t^t^f2[NumPad 1]")  blendpaintmode 2
							guiradio (concatword "^f9(5)^f~ " (at $Labels_BlendPaintMode 5) "^t^t^f2[NumPad 2]")  blendpaintmode 5
						]
					]
					guistrut 1
					guibutton "reveal blendmap^t^f2[NumPad 3]" [clearlightmaps; showblendmap]
				]
				guilist [// V
					guistrut 38 1
					guistrut 1
					guitext "paint^t^t^t^t^f2[MouseLeft]"
					guitext "change brush^t^t^f2[MouseWheel]"
					guitext "rotate brush^t^t^f2[MouseRight]"
					guistrut 1
					guibutton "clear entire blendmap^t^t^f2/clearblendmap"        [clearblendmap]
					guibutton "clear blendmap in selection^t^f2/clearblendmapsel" [clearblendmapsel]
				]
			]
		]
	]
]


//#############################################################################################################################################
EDT__Adjustments = [
	guialign 0 [// H
		guilist [// V
			guistrut 1
            guibutton "fog^t^t^t^f2/mapfog"                 [toggleeditgui "map_fog"            1 1] "menu"; guistrut 0.5
            guibutton "lighting^t^t^f2/maplighting"         [toggleeditgui "map_lighting"       1 1] "menu"; guistrut 0.5
          //guibutton "materials^t^t^f2/mapmaterials"       [toggleeditgui "editmat"            0 1] "menu"
            guistrut 2
            guibutton "atmo^t^t^t^f2/mapsky_atmo"           [toggleeditgui "map_sky_atmo"       1 1] "menu"; guistrut 0.5
            guibutton "cloudbox^t^t^f2/mapsky_cloudbox"     [toggleeditgui "map_sky_cloudbox"   1 1] "menu"; guistrut 0.5
            guibutton "cloudlayer^t^t^f2/mapsky_cloudlayer" [toggleeditgui "map_sky_cloudlayer" 1 1] "menu"; guistrut 0.5
            guibutton "skybox^t^t^f2/mapsky_skybox"         [toggleeditgui "map_sky_skybox"     1 1] "menu"
		]
	]
]


//#############################################################################################################################################
nodebug [
	defsvar WayPointFile ""
]

EDT__Waypoints = [
    guilist [// H
        guilist [// V
            guistrut 18 1
            guialign 1 [guitext "waypoints: "]
        ]
        guilist [// V
            guistrut 56 1
            WayPointFile (concatword (? $mapname $mapname "untitled") ".wpt")
            guistayopen [ guibutton (concatword (? (findfile (concatword "packages/maps/" $WayPointFile)) "" "^f4")  "load ^"" $WayPointFile "^"") [loadwaypoints] ]
            guistayopen [ guibutton (concatword "save ^"" $WayPointFile "^"") [savewaypoints] ]
            guistrut 0.5
            guicheckbox "drop  ^f2[=]" dropwaypoints
            guistrut 0.5
            guicheckbox "show  ^f2[-]" showwaypoints
            guistrut 0.5
            guilist [// H
                guilist [guistrut 15 1; guitext "view distance:"]
                guilist [guistrut 45 1; guinameslider showwaypointsradius ["inf" "256" "512" "768" "1024" "2048" "4096" "8192"] [0 256 512 768 1024 2048 4096 8192]]
            ]
        ]
    ]
]

//##############################################################################################################################################################
//##############################################################################################################################################################
nodebug [
    defvar  EDT_NewMap_Size  10 10 16
    defsvar EDT_SaveMap_Name "untitled"
]

EDT__Map = [
	guifreerow 18  1 [ guitext "newmap: "
			 ] 12 -2 [ guitext "scale:"
			 ] 45 -2 [ guislider EDT_NewMap_Size 10 16
	]
	guifreerow 18 -2 [
			 ] 12 -2 [ guitext "size:"
			 ] 45 -2 [ guinameslider EDT_NewMap_Size ["1024" "2048" "4096" "8192" "16384" "32768" "65536"] [10 11 12 13 14 15 16] []
	]
	guistrut 0.25
	guilist [// H
		guistrut 18
		guibutton "start newmap" [newmap $EDT_NewMap_Size]
	]
	guistrut 1
	guifreerow 18  1 [ guitext "savemap: "
			 ]  1 -2 [ guistayopen [ guibutton (concatword "save ^"" (? $mapname $mapname "untitled") ".cmr^"") [savemap] ]
	]
	guistrut 0.25
	guifreerow 18 -2 [
             ]  1 -2 [ guistayopen [ guibutton "save as " [savemap $EDT_SaveMap_Name] ]
             ]  1 -2 [ guifield EDT_SaveMap_Name 22
    ]
	guistrut 1
    guifreerow 18  1 [ guitext "maptitle: "
             ]  1 -2 [ guitext (escape @maptitle)
    ]
    guilist [// H
        guistrut 18
        guibutton "set map title/author"  [saycommand (concatword "/maptitle " (escape @maptitle))]
    ]
    guistrut 1
	guilist [// H
		guistrut 18
		guilist [// V
			guistayopen [
				guibutton "reload map^t^t^f2/reloadmap"         [reloadmap]
				guistrut 0.25
				guibutton "reload map config^t^f2/reloadmapcfg" [reloadmapcfg]
			]
		]
	]
	guibar //-------------------------------------------------------------------------
	guifreerow 18 -2 [
			 ] 24 -2 [ guistayopen [ guibutton "^f2/remip" remip ]
			 ]  1 -2 [ guitext "^f9(optimize octree, geometry)"
	]
	guifreerow 18 -2 [
			 ] 24 -2 [ guistayopen [ guibutton "^f2/recalc" recalc ]
			 ]  1 -2 [ guitext "^f9(regenerate: envmaps, minimap, etc)"
	]
	guibar //-------------------------------------------------------------------------
	guifreerow 18  1 [ guitext "mapscale: "
             ]  1 -2 [ guistayopen [ guitext (concatword $mapscale " (" $mapsize ")") ]
    ]

    guifreerow 18  1 [ guitext "resize: "
             ]  1 -2 [ guistayopen [ guibutton "increase mapsize (double)" mapenlarge ]
    ]
    guifreerow 18 -2 [
             ] 24 -2 [ guistayopen [ guibutton "decrease mapsize (half)" shrinkmap ]
             ]  1 -2 [ guitext "^f9(shrunk area must be empty)"
    ]
]


//#############################################################################################################################################
EDT__Cfg = [
	guitext (mapcfgname)
	guistrut 0.25
	guitexteditor (mapcfgname) -80 20
]
