//######################################################################################################################
//  Defines the GameHUD, visible bottom-right while playing:
//######################################################################################################################
gamehud = [
    concatword (
        if $debugthis     [DebugThis]
    )(  if $dropwaypoints [concatword (? (mod (div $getmillis 500) 2) "^f0" "^f3") "dropwaypoints"]
    )
]
