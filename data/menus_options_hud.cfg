nodebug [
    defvar AH_Width  1 78 0
    defvar AH_Height 1 21 0
]

newgui "adjusthud" [
    guiscale 0.65
    guikeeptab 1
    guinoautotab [guistayopen [
        // Save the frames 'guitabnum' hack:            H                               V
                            if (= $guitabnum 1) [ guilist [guistrut $AH_Height 1; guilist [guistrut 70 1; AH__Misc     ]] ]
        guitab "misc2"    ; if (= $guitabnum 2) [ guilist [guistrut $AH_Height 1; guilist [guistrut 70 1; AH__Misc2    ]] ]
        guitab "crosshair"; if (= $guitabnum 3) [ guilist [guistrut $AH_Height 1; guilist [guistrut 70 1; AH__Crosshair; guispring; guilist [guispring; guibutton "" [showgui "crosshair"]      ] ]] ]
        guitab "gameclock"; if (= $guitabnum 4) [ guilist [guistrut $AH_Height 1; guilist [guistrut 70 1; AH__GameClock; guispring; guilist [guispring; guibutton "" [showgui "adjustgameclock"]] ]] ]
        guitab "hudscore" ; if (= $guitabnum 5) [ guilist [guistrut $AH_Height 1; guilist [guistrut 70 1; AH__HudScore ; guispring; guilist [guispring; guibutton "" [showgui "adjusthudscore"] ] ]] ]
        guitab "editing"  ; if (= $guitabnum 6) [ guilist [guistrut $AH_Height 1; guilist [guistrut 70 1; AH__Editing  ]] ]
        guitab "edithud"  ; if (= $guitabnum 7) [ guilist [guistrut $AH_Height 1; guilist [guistrut 70 1; AH__EditHud  ]] ]
    ]]
] "misc" [GenCrosshairList]

newgui "crosshair"       [guiscale 0.9; AH__Crosshair] "" [GenCrosshairList]
newgui "adjustgameclock" [guiscale 0.6; AH__GameClock] "adjust gameclock"
newgui "adjusthudscore"  [guiscale 0.6; AH__HudScore ] "adjust hudscore"


