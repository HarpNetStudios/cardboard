nodebug [
    defvar SkyOutlineR 0 0 255
    defvar SkyOutlineG 0 0 255
    defvar SkyOutlineB 0 0 255

    defvar BlendBrushR 0 0 255
    defvar BlendBrushG 0 0 255
    defvar BlendBrushB 0 0 255
]

AH__Editing = [
    guititle "misc"
    guistrut 0.25
    guilist [// H
        guilist [// V
            guistrut 14 1
            guistrut 2.5
            guialign 1 [guitext "sparkly size: "]
        ]
        guilist [// V
            guistrut 56 1
            guicheckbox "show editstats while playing" showeditstats
            guistrut 0.25
            guicheckbox "show selected entity radius" showentradius
            guistrut 0.25
            guislider particlesize //  Size of entity sparklies in editmode.
            guistrut 0.25
            guicheckbox "show particles from particle entities in editmode" showparticles
        ]
    ]
    guistrut 0.5
    guilist [// H
        guilist [// V
            guistrut 14 1
            guialign 1 [guitext "blendbrushcolor: "]
            guistrut 1
            guialign 1 [guicolor $blendbrushcolor; guistrut 1]
        ]
        guilist [// V
            guistrut 56 1
            BlendBrushR (& (>> $blendbrushcolor 16) 0xFF)
            BlendBrushG (& (>> $blendbrushcolor  8) 0xFF)
            BlendBrushB (&     $blendbrushcolor     0xFF)
            guislider BlendBrushR 0 255 [blendbrushcolor $BlendBrushR $BlendBrushG $BlendBrushB]
            guislider BlendBrushG 0 255 [blendbrushcolor $BlendBrushR $BlendBrushG $BlendBrushB]
            guislider BlendBrushB 0 255 [blendbrushcolor $BlendBrushR $BlendBrushG $BlendBrushB]
        ]
    ]

    guibar
    guititle "skytexture"
    guistrut 0.25
    guilist [// H
        guilist [// V
            guistrut 14 1
            guistrut 1.5
            guialign 1 [guitext "outlinecolor: "]
            guistrut 1
            guialign 1 [guicolor $skyoutlinecolor; guistrut 1]
        ]
        guilist [// V
            guistrut 56 1
            guistrut 0.25
            guilist [// H
                guicheckbox "show outline" showskyoutline
                guistrut 10
                guicheckbox "show surface ^f9(with skytexture 0)" showsky
            ]
            guistrut 0.25
            SkyOutlineR (& (>> $skyoutlinecolor 16) 0xFF)
            SkyOutlineG (& (>> $skyoutlinecolor  8) 0xFF)
            SkyOutlineB (&     $skyoutlinecolor     0xFF)
            guislider SkyOutlineR 0 255 [skyoutlinecolor $SkyOutlineR $SkyOutlineG $SkyOutlineB]
            guislider SkyOutlineG 0 255 [skyoutlinecolor $SkyOutlineR $SkyOutlineG $SkyOutlineB]
            guislider SkyOutlineB 0 255 [skyoutlinecolor $SkyOutlineR $SkyOutlineG $SkyOutlineB]
        ]
    ]

    guibar
    guititle "waypoints"
    guistrut 0.25
    guilist [// H
        guilist [// V
            guistrut 14 1
            guistrut 1.5
            guialign 1 [guitext "view distance: "]
        ]
        guilist [// V
            guistrut 56 1
            guistrut 0.25
            guilist [// H
                guicheckbox "show  ^f2[-]" showwaypoints
                guistrut 2
                guicheckbox "drop  ^f2[=]" dropwaypoints
            ]
            guistrut 0.25
            guislider showwaypointsradius
        ]
    ]
]


