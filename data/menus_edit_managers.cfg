//##############################################################################################################################################################
//##############################################################################################################################################################
//  Entity Manager:
nodebug [
    defvarp EM_EntsPerColumn 16 32  64
    defvarp EM_ColumnsPerTab  1  2   4
    defvar  EM_EntsPerTab    -1 -1 512
    defvar  EM_NumOf_Columns -1 -1 625
    defvar  EM_NumOf_Tabs    -1 -1 625

    defvar  EM_WidthColumn   24 48  96
    defvar  EM_Width         -1 -1 384
    defvar  EM_Height        -1 -1  64

    defvar  EM_NumOf_Ents          -1 -1 10000  //  MAXENTS = 10,000
    defvar  EM_NumOf_Ammo           0  0 10000
    defvar  EM_NumOf_Base           0  0 10000
    defvar  EM_NumOf_EnvMap         0  0 10000
    defvar  EM_NumOf_Flag           0  0 10000
    defvar  EM_NumOf_Health         0  0 10000
    defvar  EM_NumOf_JumpPad        0  0 10000
    defvar  EM_NumOf_Light          0  0 10000
    defvar  EM_NumOf_MapModel       0  0 10000
    defvar  EM_NumOf_Particles      0  0 10000
    defvar  EM_NumOf_PlayerStart0   0  0 10000
    defvar  EM_NumOf_PlayerStart1   0  0 10000
    defvar  EM_NumOf_PlayerStart2   0  0 10000
    defvar  EM_NumOf_Start          0  0 10000
    defvar  EM_NumOf_Checkpoint     0  0 10000
    defvar  EM_NumOf_Finish         0  0 10000
    defvar  EM_NumOf_Sound          0  0 10000
    defvar  EM_NumOf_SpotLight      0  0 10000
    defvar  EM_NumOf_Teledest       0  0 10000
    defvar  EM_NumOf_Teleport       0  0 10000

    EM_EntList = ""  //  Alias strings can be much longer.
]

//newgui "entitymanager" [ if (|| (! $editing) (! (ingame))) [cleargui] [EM_Main]  ] "info" [EM__GenEntList]
//EM_Main = [
newgui "entitymanager" [
    guieditingcheck
    guikeeptab 1
    if (!= $EM_NumOf_Ents $numoctaents 1) [EM__GenEntList]
    guistayopen [
        //######################################################################################################################################################
        guilist [// H
            guistrut $EM_Height 1
            guilist [// V
                guistrut $EM_Width 1
                //  Is this the active Tab? If so, populate.
                if (= $guitabnum 1) [
                    guititle "Entity Manager"
                    guibar
                    guialign 0 [// H
                        guilist [// V
                            guititle "Options"
                            guistrut 1
                            guilist [
                                guitext (format " ^f7EntsPerColumn:^t%1^t" $EM_EntsPerColumn)
                                guibutton "" [EM_EntsPerColumn (+ $EM_EntsPerColumn -1); if (< $EM_EntsPerColumn 16) [EM_EntsPerColumn 16]; EM__Recalc] "val_dec"
                                guibutton "" [EM_EntsPerColumn (+ $EM_EntsPerColumn  1); if (> $EM_EntsPerColumn 64) [EM_EntsPerColumn 64]; EM__Recalc] "val_inc"
                            ]
                            guilist [
                                guitext (format " ^f7ColumnsPerTab: ^t%1^t" $EM_ColumnsPerTab)
                                guibutton "" [EM_ColumnsPerTab (+ $EM_ColumnsPerTab -1); if (< $EM_ColumnsPerTab 1) [EM_ColumnsPerTab 1]; EM__Recalc] "val_dec"
                                guibutton "" [EM_ColumnsPerTab (+ $EM_ColumnsPerTab  1); if (> $EM_ColumnsPerTab 8) [EM_ColumnsPerTab 8]; EM__Recalc] "val_inc"
                            ]
                            guistrut 1
                            guitext (concatword " NumOf Columns: ^t" $EM_NumOf_Columns)
                            guitext (concatword " NumOf Tabs:    ^t" $EM_NumOf_Tabs   )
                            guistrut 1
                        ]
                        guibar
                        guilist [// V
                            guititle "Stats"
                            guistrut 1
                            guialign 0 [guitext (concatword " NumOf Entities: " $EM_NumOf_Ents)]
                            guibar
                            guilist [// H
                                guilist [// V
                                    guifreerow 15 1 [guitext "Player Start 0: "  ] 4 1 [guitext $EM_NumOf_PlayerStart0 ] 3 -2 [guicheckbox BLARG]    //@@   3 -2 [] ????
                                    guifreerow 15 1 [guitext "Player Start 1: "  ] 4 1 [guitext $EM_NumOf_PlayerStart1 ] 3 -2 [guicheckbox BLARG]
                                    guifreerow 15 1 [guitext "Player Start 2: "  ] 4 1 [guitext $EM_NumOf_PlayerStart2 ] 3 -2 [guicheckbox BLARG]
                                    guistrut 0.5                                                                       
                                    guifreerow 15 1 [guitext "Base: "            ] 4 1 [guitext $EM_NumOf_Base         ] 3 -2 [guicheckbox BLARG]
                                    guistrut 0.5                                                                       
                                    guifreerow 15 1 [guitext "Flag: "            ] 4 1 [guitext $EM_NumOf_Flag         ] 3 -2 [guicheckbox BLARG]
                                    guistrut 0.5                                                                       
                                    guifreerow 15 1 [guitext "Jump Pad: "        ] 4 1 [guitext $EM_NumOf_JumpPad      ] 3 -2 [guicheckbox BLARG]
                                    guistrut 0.5                                                                       
                                    guifreerow 15 1 [guitext "Teledest: "        ] 4 1 [guitext $EM_NumOf_Teledest     ] 3 -2 [guicheckbox BLARG]
                                    guifreerow 15 1 [guitext "Teleport: "        ] 4 1 [guitext $EM_NumOf_Teleport     ] 3 -2 [guicheckbox BLARG]
                                    guibar                                                                             
                                    guifreerow 15 1 [guitext "Env Map: "         ] 4 1 [guitext $EM_NumOf_EnvMap       ] 3 -2 [guicheckbox BLARG]
                                    guistrut 0.5                                                                       
                                    guifreerow 15 1 [guitext "Light: "           ] 4 1 [guitext $EM_NumOf_Light        ] 3 -2 [guicheckbox BLARG]
                                    guifreerow 15 1 [guitext "Spot Light: "      ] 4 1 [guitext $EM_NumOf_SpotLight    ] 3 -2 [guicheckbox BLARG]
                                    guistrut 0.5                                                                       
                                    guifreerow 15 1 [guitext "Map Model: "       ] 4 1 [guitext $EM_NumOf_MapModel     ] 3 -2 [guicheckbox BLARG]
                                    guistrut 0.5                                                                       
                                    guifreerow 15 1 [guitext "Particles: "       ] 4 1 [guitext $EM_NumOf_Particles    ] 3 -2 [guicheckbox BLARG]
                                    guistrut 0.5                                                                       
                                    guifreerow 15 1 [guitext "Sound: "           ] 4 1 [guitext $EM_NumOf_Sound        ] 3 -2 [guicheckbox BLARG]
                                ]                                                                                      
                                guibar                                                                                 
                                guilist [// V                                                                          
                                    guifreerow 15 1 [guitext "Ammo: "            ] 4 1 [guitext $EM_NumOf_Ammo         ] 3 -2 [guicheckbox BLARG]
                                    guifreerow 15 1 [guitext "^f8Health: "       ] 4 1 [guitext $EM_NumOf_Health       ] 3 -2 [guicheckbox BLARG]
                                    guistrut 0.5                                 
                                    guifreerow 15 1 [guitext "Race Start: "      ] 4 1 [guitext $EM_NumOf_Start        ] 3 -2 [guicheckbox BLARG]
                                    guifreerow 15 1 [guitext "Race Checkpoint: " ] 4 1 [guitext $EM_NumOf_Checkpoint   ] 3 -2 [guicheckbox BLARG]
                                    guifreerow 15 1 [guitext "Race Finish: "     ] 4 1 [guitext $EM_NumOf_Finish       ] 3 -2 [guicheckbox BLARG]
                                ]
                            ]
                            guibar
                            guistrut 1
                        ]
                    ]
                ]
            ]
        ]
        //######################################################################################################################################################
        loop iTab $EM_NumOf_Tabs [
            guitab (* $iTab $EM_EntsPerTab)
            guilist [// H
                // Is this the active Tab? If so, populate.
                if (= $iTab (- $guitabnum 2)) [
                    iEnt = (* $iTab $EM_EntsPerTab)
                    iCol = 1
                    while [<= $iCol $EM_ColumnsPerTab] [
                        guilist [// V
                            iEND = (+ (* $iTab $EM_EntsPerTab) (- (* $iCol $EM_EntsPerColumn) 1))
                            while [<= $iEnt $iEND] [
                                if (>= $iEnt $EM_NumOf_Ents) [
                                    iEnt = (+ $iEND 1) // exitloop/break
                                ][
                                    This = (at $EM_EntList $iEnt)
                                    guilist [// H
                                        guilist [guistrut  7 1; guialign 1 [guibutton (concatword "^f7[^f2" (iEnt) "^f7]") (concat "cancelsel; entselect [= $entindex " $iEnt "]; gotosel") 0]]
                                        guilist [guistrut 11 1; guialign 1 [guibutton (concatword "^f2" (at $This 0)) (concat "cancelsel; entselect [= $entindex " $iEnt "]; gotosel") 0]]
                                        guilist [guistrut  6 1; guialign 1 [guitext   (concatword "^f2" (at $This 1))]]
                                        guilist [guistrut  6 1; guialign 1 [guitext   (concatword "^f2" (at $This 2))]]
                                        guilist [guistrut  6 1; guialign 1 [guitext   (concatword "^f2" (at $This 3))]]
                                        guilist [guistrut  6 1; guialign 1 [guitext   (concatword "^f2" (at $This 4))]]
                                        guilist [guistrut  6 1; guialign 1 [guitext   (concatword "^f2" (at $This 5))]]
                                    ]
                                    iEnt = (+ $iEnt 1)
                                ]
                            ]
                            iCol = (+ $iCol 1)
                        ]
                    ]
                ]
            ]
        ]
        //######################################################################################################################################################
    ]
] "info" [EM__GenEntList]

EM__GenEntList = [
    EM_NumOf_Ents $numoctaents

    EM_EntList = ""
    cancelsel; entfind *
    entloop [
        EM_EntList = (concatword $EM_EntList (escape $entget))
    ]

    cancelsel; entfind ammo           ; EM_NumOf_Ammo         $enthavesel
    cancelsel; entfind base           ; EM_NumOf_Base         $enthavesel
    cancelsel; entfind envmap         ; EM_NumOf_EnvMap       $enthavesel
    cancelsel; entfind flag           ; EM_NumOf_Flag         $enthavesel
    cancelsel; entfind health         ; EM_NumOf_Health       $enthavesel
    cancelsel; entfind jumppad        ; EM_NumOf_JumpPad      $enthavesel
    cancelsel; entfind light          ; EM_NumOf_Light        $enthavesel
    cancelsel; entfind mapmodel       ; EM_NumOf_MapModel     $enthavesel
    cancelsel; entfind particles      ; EM_NumOf_Particles    $enthavesel
    cancelsel; entfind playerstart * 0; EM_NumOf_PlayerStart0 $enthavesel
    cancelsel; entfind playerstart * 1; EM_NumOf_PlayerStart1 $enthavesel
    cancelsel; entfind playerstart * 2; EM_NumOf_PlayerStart2 $enthavesel
    cancelsel; entfind sound          ; EM_NumOf_Sound        $enthavesel
    cancelsel; entfind spotlight      ; EM_NumOf_SpotLight    $enthavesel
    cancelsel; entfind teledest       ; EM_NumOf_Teledest     $enthavesel
    cancelsel; entfind teleport       ; EM_NumOf_Teleport     $enthavesel
    cancelsel; entfind start          ; EM_NumOf_Start        $enthavesel
    cancelsel; entfind checkpoint     ; EM_NumOf_Checkpoint   $enthavesel
    cancelsel; entfind finish         ; EM_NumOf_Finish       $enthavesel
    cancelsel

    //nummapmodels
    //nummapsounds
    //nummonsters
    //numsounds

    EM__Recalc
]

EM__Recalc = [
    EM_EntsPerTab    (* $EM_EntsPerColumn $EM_ColumnsPerTab)
    EM_NumOf_Columns (+ (ceil (divf $EM_NumOf_Ents    $EM_EntsPerColumn))) //  (+ n) <-- Float to Int hack.
    EM_NumOf_Tabs    (+ (ceil (divf $EM_NumOf_Columns $EM_ColumnsPerTab)))
    EM_Width         (* $EM_ColumnsPerTab $EM_WidthColumn)
    EM_Height           $EM_EntsPerColumn
]


//##############################################################################################################################################################
//##############################################################################################################################################################
//  TextureSlot Manager:
nodebug [
    defvarp TSM_SlotsPerColumn 16 36    64
    defvarp TSM_ColumnsPerTab   1  2     4
    defvarp TSM_ShowLayerParams 0  0     1

    defvar  TSM_WidthColumn    24 48    96
    defvar  TSM_WidthSideBar    0 50    96

    defvar  TSM_Width          -1 -1   480
    defvar  TSM_Height         -1 -1    64

    defvar  TSM_NumOf_Columns  -1 -1  4096
    defvar  TSM_NumOf_Tabs     -1 -1  4096
    defvar  TSM_SlotsPerTab    -1 -1 16384

    defvar  TSM_NumOf_Slots      -1 -1 65535 //  Texture slot index is an 'unsigned short'.
    defvar  TSM_NumOf_vSlots     -1 -1 65535
    defvar  TSM_NumOf_SlotsTotal -1 -1 65535
    defvar  TSM_SelectedSlot     -1 -1 65535
]

//newgui "texslotmanager" [ if (|| (! $editing) (! (ingame))) [cleargui 1] [TSM_Main] ] "info" [TSM__Recalc]
//TSM_Main = [
newgui "texslotmanager" [
    guieditingcheck
    guikeeptab 1
    if (!= $TSM_NumOf_SlotsTotal $numvslots) [TSM__Update]
    guistayopen [
        //######################################################################################################################################################
        guialign 0 [// H
            guistrut $TSM_Height 1
            guilist [// V
                guistrut $TSM_Width 1
                guititle "Texture Slot Manager"
                guibar //---------------------------------------------------------------------------------------------------------------------------------------
                guialign 0 [// H
                    guilist [// V
                        guititle "Options"
                        guistrut 1
                        guilist [// H
                            guitext (format " ^f7SlotsPerColumn:^t%1^t"  $TSM_SlotsPerColumn)
                            guibutton "" [TSM_SlotsPerColumn (+ $TSM_SlotsPerColumn -1); if (< $TSM_SlotsPerColumn 16) [TSM_SlotsPerColumn 16]; TSM__Recalc] "val_dec"
                            guibutton "" [TSM_SlotsPerColumn (+ $TSM_SlotsPerColumn  1); if (> $TSM_SlotsPerColumn 64) [TSM_SlotsPerColumn 64]; TSM__Recalc] "val_inc"
                        ]
                        guilist [// H
                            guitext (format " ^f7ColumnsPerTab: ^t%1^t"  $TSM_ColumnsPerTab)
                            guibutton "" [TSM_ColumnsPerTab (+ $TSM_ColumnsPerTab -1); if (< $TSM_ColumnsPerTab 1) [TSM_ColumnsPerTab 1]; TSM__Recalc] "val_dec"
                            guibutton "" [TSM_ColumnsPerTab (+ $TSM_ColumnsPerTab  1); if (> $TSM_ColumnsPerTab 4) [TSM_ColumnsPerTab 4]; TSM__Recalc] "val_inc"
                        ]
                        guistrut 1
                        guitext (concatword " NumOf Columns: ^t" $TSM_NumOf_Columns)
                        guitext (concatword " NumOf Tabs:    ^t" $TSM_NumOf_Tabs   )
                        guistrut 1
                        guilist [guistrut 1; guicheckbox " Show Layer Parameters" TSM_ShowLayerParams]
                        guistrut 1
                        guibar //-------------------------------------------------------------------------------------------------------------------------------
                        guititle "Stats"
                        guistrut 1
                        guitext (concatword " NumOf Slots:   ^t"  $TSM_NumOf_Slots     )
                        guitext (concatword " NumOf vSlots:  ^t"  $TSM_NumOf_vSlots    )
                        guistrut 0.5
                        guitext (concatword " Total:         ^t" $TSM_NumOf_SlotsTotal)
                        guistrut 1
                    ]
                    guibar //-----------------------------------------------------------------------------------------------------------------------------------
                    guilist [// V
                        guititle "Info"
                        guistrut 1
                        guitext "   ^f7White^t = Texture is loaded."
                        guitext "   ^f4Grey^t = Texture is not loaded."
                        guitext "   ^f2Yellow^t = Texture is vSlot."
                        guistrut 1
                        guitext " A texture can be loaded and un-used."
                        guitext " Use ^f2/reloadmap ^f~or ^f2/resetgl ^f~if you would like to see if the map is using a texture."
                        guistrut 1
                        guibar //-------------------------------------------------------------------------------------------------------------------------------
                        guititle "CleanUp / Optimize"
                        guistrut 1
                        guitext " vSlots are automatically optimized upon ^f2/savemap^f~."
                        guistrut 1
                        guitext " vSlots will automatically optimize when this many new vslots have been created:"
                        guistrut 0.5
                        guilist [// H
                            guitext "^f7   autocompactvslots: "
                            guilist [// V
                                guistrut 32 1
                                guislider autocompactvslots 0 1024 [autocompactvslots (round $autocompactvslots 32)]
                            ]
                            guitext "^f9 (default 256)"
                        ]
                        guistrut 1.5
                        guitext " Manually optimize vSlots:"
                        guistrut 0.5
                        guilist [guistrut 3; guibutton "^f2/compactvslots" [compactvslots]]
                        guistrut 1.5
                        guitext " This will set the texture of all hidden cube faces to slot[1] (default texture):"
                        guistrut 0.5
                        guilist [guistrut 3; guibutton "^f2/fixinsidefaces" [fixinsidefaces]]
                        guistrut 1
                    ]
                ]
            ]
        ]
        //######################################################################################################################################################
        loop iTab $TSM_NumOf_Tabs [
            guitab (* $iTab $TSM_SlotsPerTab)
            guialign 0 [// H
                guistrut $TSM_Height 1
                //==============================================================================================================================================
                //  Is this the active Tab?  If so, populate.
                if (= $iTab (- $guitabnum 2)) [
                    iTex = (* $iTab $TSM_SlotsPerTab)
                    iCol = 1
                    while [<= $iCol $TSM_ColumnsPerTab] [
                        guilist [// V
                            guistrut $TSM_WidthColumn 1
                            iEND = (+ (* $iTab $TSM_SlotsPerTab) (- (* $iCol $TSM_SlotsPerColumn) 1))
                            while [<= $iTex $iEND] [
                                if (>= $iTex $TSM_NumOf_SlotsTotal) [
                                    iTex = (+ $iEND 1) // exitloop/break
                                ][
                                    cond [= $iTex $TSM_SelectedSlot] [ TextColor = "^f8" // Selected
                                    ]    [= (getslottex $iTex) -1  ] [ TextColor = "^f2" // Is vSlot
                                    ]    [    texloaded $iTex      ] [ TextColor = "^f7" // Is Loaded
                                    ]                                [ TextColor = "^f4" // Is Not Loaded
                                    ]
                                    guibutton (concatword " ^f7[^f2" $iTex "^f7] " $TextColor (gettexname $iTex)) (concat "TSM_SelectedSlot" $iTex) 0
                                    iTex = (+ $iTex 1)
                                ]
                            ]
                            iCol = (+ $iCol 1)
                        ]
                    ]
                    guibar //-----------------------------------------------------------------------------------------------------------------------------------
                    guilist [// V
                        guistrut $TSM_WidthSideBar 1
                        guialign 0 [// H
                            guiimage (concatword "packages/" (gettexname $TSM_SelectedSlot)) 0 7 0 "data/cardboard_missing.png" // <thumbnail:256>  <-- Breaks non-square textures.
                            if (!= (getvlayer $TSM_SelectedSlot) 0) [
                                guiimage (concatword "packages/" (gettexname (getvlayer $TSM_SelectedSlot)) ) () 4 0 "data/cardboard_missing.png"
                            ]
                        ]
                        if (< $TSM_SelectedSlot 0) [
                            guitext " ^f~[^f2~^f~,^f2~^f~] ^f2^"~^""
                        ][
                                                                 guitext (concatword " ^f~[^f2" $TSM_SelectedSlot "^f~,^f20^f~] ^f2^"" (gettexname $TSM_SelectedSlot 0) "^"" )
                            if (gettexname $TSM_SelectedSlot 1) [guitext (concatword " ^f~[^f2" $TSM_SelectedSlot "^f~,^f21^f~] ^f2^"" (gettexname $TSM_SelectedSlot 1) "^"" )]
                            if (gettexname $TSM_SelectedSlot 2) [guitext (concatword " ^f~[^f2" $TSM_SelectedSlot "^f~,^f22^f~] ^f2^"" (gettexname $TSM_SelectedSlot 2) "^"" )]
                            if (gettexname $TSM_SelectedSlot 3) [guitext (concatword " ^f~[^f2" $TSM_SelectedSlot "^f~,^f23^f~] ^f2^"" (gettexname $TSM_SelectedSlot 3) "^"" )]
                            if (gettexname $TSM_SelectedSlot 4) [guitext (concatword " ^f~[^f2" $TSM_SelectedSlot "^f~,^f24^f~] ^f2^"" (gettexname $TSM_SelectedSlot 4) "^"" )]
                            if (gettexname $TSM_SelectedSlot 5) [guitext (concatword " ^f~[^f2" $TSM_SelectedSlot "^f~,^f25^f~] ^f2^"" (gettexname $TSM_SelectedSlot 5) "^"" )]
                            if (gettexname $TSM_SelectedSlot 6) [guitext (concatword " ^f~[^f2" $TSM_SelectedSlot "^f~,^f26^f~] ^f2^"" (gettexname $TSM_SelectedSlot 6) "^"" )]
                            if (gettexname $TSM_SelectedSlot 7) [guitext (concatword " ^f~[^f2" $TSM_SelectedSlot "^f~,^f27^f~] ^f2^"" (gettexname $TSM_SelectedSlot 7) "^"" )]
                        ]
                        TSM__Parameters $TSM_SelectedSlot
                        guibar //-------------------------------------------------------------------------------------------------------------------------------
                        if (!= (getvlayer $TSM_SelectedSlot) 0) [
                            guitext (format " ^f~layer: ^f~[^f6%1^f~] ^f6^"%2^""  (getvlayer $TSM_SelectedSlot) (gettexname (getvlayer $TSM_SelectedSlot)) )
                            if (!= $TSM_ShowLayerParams 0) [
                                TSM__Parameters (getvlayer $TSM_SelectedSlot)
                            ]
                            if (getvlayermaskname $TSM_SelectedSlot) [
                                guistrut 0.5
                                guifreerow 10  1 [ guitext "layermask: "
                                         ]  1 -2 [ guitext (concatword "^f2^"" (getvlayermaskname $TSM_SelectedSlot) "^"")
                                ]
                                guifreerow 10  1 [ guitext "mode: "
                                         ]  1 -2 [ guitext (concatword "^f2" (getvlayermaskmode $TSM_SelectedSlot) " ^f7^"" $(concatword "EH_LayerMaskMode_"(getvlayermaskmode $TSM_SelectedSlot)) "^"")
                                ]
                                guifreerow 10  1 [ guitext "scale: "
                                         ]  1 -2 [ guitext (concatword "^f2" (getvlayermaskscale $TSM_SelectedSlot))
                                ]
                            ]
                        ][
                            guitext " ^f~layer: ^f~[^f6~^f~] ^f6^"none^""
                        ]
                    ]
                ]
                //==============================================================================================================================================
            ]
        ]
        //######################################################################################################################################################
    ]
] "info" [TSM__Recalc]

// ARGS  1: INDEX   Texture slot.
TSM__Parameters = [
    guifreerow 12  1 [ guitext "color:"
             ]  8  1 [ guitext (concatword "^f3" (at (getvcolor @arg1) 0))
             ]  8  1 [ guitext (concatword "^f0" (at (getvcolor @arg1) 1))
             ]  8  1 [ guitext (concatword "^f1" (at (getvcolor @arg1) 2))
    ]
    guistrut 0.08333 //0.09375
    guifreerow 12  1 [ guitext "alpha:"
             ]  8  1 [ guitext (concatword "^f5" (at (getvalpha @arg1) 0))
             ]  8  1 [ guitext (concatword "^f5" (at (getvalpha @arg1) 1))
    ]
    guistrut 0.08333
    guifreerow 12  1 [ guitext "rotate:"
             ]  8  1 [ guitext (concatword "^f2" (getvrotate @arg1))
             ]  1 -1 [ guitext (concatword " ^f7^"" (at $Labels_TexRotate (getvrotate @arg1)) "^"")
    ]
    guistrut 0.08333
    guifreerow 12  1 [ guitext "offset:"
             ]  8  1 [ guitext (concatword "^f3" (at (getvoffset @arg1) 0))
             ]  8  1 [ guitext (concatword "^f0" (at (getvoffset @arg1) 1))
    ]
    guistrut 0.08333
    guifreerow 12  1 [ guitext "scale:"
             ]  8  1 [ guitext (concatword "^f2" (getvscale @arg1))
    ]
    guistrut 0.08333
    guifreerow 12  1 [ guitext "scroll:"
             ]  8  1 [ guitext (concatword "^f3" (at (getvscroll @arg1) 0))
             ]  8  1 [ guitext (concatword "^f0" (at (getvscroll @arg1) 1))
    ]
    guistrut 0.08333
    guifreerow 12  1 [ guitext "smooth:"
             ]  7 -2 [ guitext " ^f7group:"
             ]  4  1 [ guitext (concatword "^f2" (getvsmooth @arg1))
             ] 10 -2 [ guitext "  ^f7threshold:"
             ]  4  1 [ guitext (concatword "^f2" (getsmoothangle (getvsmooth @arg1)))
    ]
    guistrut 0.08333
    guifreerow 12  1 [ guitext "vshaderparam:"
             ]  1 -2 [ guitext (concatword " ^f2^"" (getvshaderparamnames @arg1) "^" " (getvshaderparam @arg1 (getvshaderparamnames @arg1)) )
    ]
]

TSM__Recalc = [
    TSM_SlotsPerTab   (* $TSM_SlotsPerColumn $TSM_ColumnsPerTab)
    TSM_NumOf_Columns (+ (ceil (divf $TSM_NumOf_SlotsTotal $TSM_SlotsPerColumn)))
    TSM_NumOf_Tabs    (+ (ceil (divf $TSM_NumOf_Columns  $TSM_ColumnsPerTab )))
    TSM_Width         (+ (+ (* $TSM_ColumnsPerTab $TSM_WidthColumn) $TSM_WidthSideBar) 2) //<-- +2 to account for guibar.
    TSM_Height        $TSM_SlotsPerColumn
]

TSM__Update = [
    TSM_NumOf_Slots      $numslots
    TSM_NumOf_vSlots     (- $numvslots $numslots)
    TSM_NumOf_SlotsTotal $numvslots
    TSM_SelectedSlot     -1
    TSM__Recalc
]
