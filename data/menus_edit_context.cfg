nodebug [
    defvar CTX_Context 0 0 5
]

newgui "context" [
    guieditingcheck
    guiscale 0.6

    guilist [// H
        guilist [// V
            guistrut 48 1
            case ($CTX_Context) 0 [
                guititle "context: ???"
                guistrut 0.5
                guialign 0 [guitext "how did you get here?"]

            ] 1 [
                guititle "context: heightmap"
                guistrut 0.5
                guicheckbox "hmapedit" hmapedit
                guistrut 0.5
                guitext "currentbrush:"
                loop i (+ $HM_BrushCount 1) [
                    guiradio (concatword "[^f2" $i "^f~] ^"" (at $(concatword "brush_" $i) 1) "^"") currentbrush $i [brush_@i]
                ]

            ] 2 [
                guititle "context: blendmap"
                guistrut 0.5
                guitext (concatword "^f~mode: ^f2^""(at $Labels_BlendPaintMode $blendpaintmode)"^"")
                guitext (concatword "^f~brush: ^f~[^f2"(curblendbrush)"^f~] ^f2^""(getblendbrushname $curblendbrush)"^"")

            ] 3 [
                guititle "context: entity"
                guistrut 0.5
                //cleargui
                //showgui "editent"

            ] 4 [
                guititle "context: waypoints"
                guistrut 0.5
                guialign 0 [// H
                    guicheckbox "show  ^f2[-]" showwaypoints
                    guistrut 4
                    guicheckbox "drop  ^f2[=]" dropwaypoints
                ]
                guistrut 1.5
                guistayopen [
                    WayPointFile (concatword (? $mapname $mapname "untitled") ".wpt")
                    guialign 0 [guibutton (concatword (? (findfile (concatword "packages/maps/" $WayPointFile)) "" "^f4")  "load ^"" $WayPointFile "^"") [loadwaypoints]]
                    guistrut 0.75
                    guialign 0 [guibutton (concatword "save ^"" $WayPointFile "^"") [savewaypoints]]
                ]
                guistrut 1.5
                guilist [// H
                    guilist [guistrut 12 1; guitext "view distance:"]
                    guilist [guistrut 36 1; guislider showwaypointsradius]
                ]

            ] 5 [
                guititle "context: cube(s)"
                guistrut 0.5
                guibutton "cube prefabs^t^t^t^t^f2/togglepfgui"                     [showgui "prefabs"]     ; guistrut 0.25
                guibutton "cube materials^t^t^t^t^f2/materialgui"                   [showgui "editmat"]
                guistrut 1
                guibutton "texture^t^t^t^t^t^f2/toggletexgui^t^t[F2]"               [showtexgui] "menu"     ; guistrut 0.25
                guibutton "texture vcolor editor^t^t^t^f2/vcolorgui^t^t^t[F7]"      [showgui "vcolor"]      ; guistrut 0.25
                guibutton "texture vshaderparam editor^t^f2/vshaderparamgui^t[F8]"  [showgui "vshaderparam"]
                guistrut 1
                guibutton "new entity^t^t^t^t^t^f2/newentgui"                       [showgui "newent"]      ; guistrut 0.25
                guibutton "new mapmodel entity^t^t^f2/togglemmgui^t^t[F4]"          [showgui "mapmodels"]
            ]
        ]
        guibar //###############################################################################################################################
        guilist [// V
            guistrut 16 1
            guititle "map vars"
            guistrut 0.5
            guibutton "fog"        [showgui "map_fog"           ]; guistrut 0.25
            guibutton "lighting"   [showgui "map_lighting"      ]
            guistrut 1
            guititle "sky"
            guibutton "atmo"       [showgui "map_sky_atmo"      ]; guistrut 0.25
            guibutton "cloudbox"   [showgui "map_sky_cloudbox"  ]; guistrut 0.25
            guibutton "cloudlayer" [showgui "map_sky_cloudlayer"]; guistrut 0.25
            guibutton "skybox"     [showgui "map_sky_skybox"    ]
          //guistrut 1
          //guibutton "....." [showgui "map_vars"]
            guistrut 0.5
            guibar //===================================================================================================
            guistrut 0.5
            guibutton "editing" [showgui "editing"]
            guistrut 1
        ]
    ]
] 0 [CTX__GetContext]

CTX__GetContext = [
    CTX_Context 0
    cond [  $hmapedit  ][ CTX_Context 1 // "Heightmap"
    ][ $blendpaintmode ][ CTX_Context 2 // "Blendmap"
    ][   $enthavesel   ][ CTX_Context 3 // "Entity"
    ][ $showwaypoints  ][ CTX_Context 4 // "Waypoints"
    ]                   [ CTX_Context 5 // "Geometry" "Cube" "Cube(s)"
    ]
]

