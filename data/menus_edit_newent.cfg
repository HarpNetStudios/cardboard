nodebug [
	defvar NE_TrigMapModel -1 -1 65535
	defvar NE_TrigType      0  0 65535
]

NE__Trigger = [
	guilist [// H
		guilist [//V
			guiradio "invisible" NE_TrigMapModel -1
			guiradio "a carrot"  NE_TrigMapModel 23
			guiradio "switch #1" NE_TrigMapModel 24
			guiradio "switch #2" NE_TrigMapModel 25
			guiradio "door #1"   NE_TrigMapModel 26
			guiradio "door #2"   NE_TrigMapModel 27
			guiradio "door #3"   NE_TrigMapModel 28 // Model preview ???
		]
		guibar
		guilist [//V
			guiradio "animation loop"                      NE_TrigType  0
			guiradio "trigger once (popback)"              NE_TrigType  1
			guiradio "trigger once (popback & rumble)"     NE_TrigType  2
			guiradio "trigger once"                        NE_TrigType  3
			guiradio "trigger once (rumble)"               NE_TrigType  4
			guiradio "trigger multiple (popback)"          NE_TrigType  5
			guiradio "trigger multiple (popback & rumble)" NE_TrigType  6
			guiradio "trigger multiple"                    NE_TrigType  7
			guiradio "trigger multiple (rumble)"           NE_TrigType  8
			guiradio "door (open once)"                    NE_TrigType  9
			guiradio "door (auto close)"                   NE_TrigType 10
			guiradio "door (locked)"                       NE_TrigType 11
			guiradio "vanishing trigger"                   NE_TrigType 12
			guiradio "vanishing trigger (rumble)"          NE_TrigType 13
			guiradio "End of Level Trigger"                NE_TrigType 29
		]
		guibar
		guilist [//V
			loop i 9 [
				_tjt = (concat tag (concatword # $i))
				_tjc = (concat BTti "=" $i ";" "NE__BuildTrigger")
				guibutton $_tjt $_tjc
			]
		]
	]
]

NE__BuildTrigger = [newent mapmodel $BTmm $BTtt $BTti]
