nodebug [
	defsvar NewEntString "/newent *"
]

newgui "newent" [
	cond [>= (strstr $guirolloveraction "showgui") 0][ NewEntString (concat (at $guirollovername 0) "*")
	]    [>= (strstr $guirolloveraction "newent")  0][ NewEntString $guirollovername
	]
	guistrut 0.25
	guititle (concatword "^f2/newent " $NewEntString)
	guistrut 0.75
	guilist [// H
		guilist [// V
			guistrut 12 1
		]
		guilist [// V
			guistrut 22 1
			guibutton "light"             [showgui "newent_light"]
			guibutton "mapmodel  ^f2[F4]" [showgui "mapmodels"]
			guibutton "jumppad"           [newent jumppad] //[showgui "newent_jumppad"]
			guibutton "teleport"          [showgui "newent_teleport"]
			guibutton "checkpoint"        [newent checkpoint] //[showgui "newent_checkpoint"]
		]
		guilist [// V
			guistrut 22 1
			guibutton "playerstart"       [newent playerstart]
			guibutton "playerstart ^f31"  [newent playerstart 1]
			guibutton "playerstart ^f12"  [newent playerstart 2]
			guibutton "^f4ammo"           [newent ammo]
			guibutton "start"             [newent start] //[showgui "newent_start"]
		 ]
		guilist [// V
			guibutton "base"              [newent base]
			guibutton "flag ^f31"         [newent flag 1]
			guibutton "flag ^f12"         [newent flag 2]
			guibutton "^f4health"         [newent health]
			guibutton "finish"            [newent finish] //[showgui "newent_finish"]
		]
	]
	guistrut 0.25
	guialign 0 [
		guibutton "select all pickup entities  ^f2/entfindpickups"   [entfindpickups]
	]
]


//##############################################################################################################################################################
//##############################################################################################################################################################
newgui "newent_light"    [ guiscale .7; NE__Light    ] "newent > light"    []
newgui "newent_teleport" [ guiscale .7; NE__Teleport ] "newent > teleport" [NE__GenTeleLists]
newgui "newent_trigger"  [ guiscale .7; NE__Trigger  ] "newent > trigger"  []

//##############################################################################################################################################################
//##############################################################################################################################################################
nodebug [
	defvar NE_LightPreset -1 0 9
	defvar NE_LightBright  0 1 1

	defvar NE_LightRadius 0 128 512
	defvar NE_LightColorR 0 255 255
	defvar NE_LightColorG 0 255 255
	defvar NE_LightColorB 0 255 255
]

NE__Light = [
	guialign 0 [
		guititle (concatword "^f2/newent light ^f2" $NE_LightRadius " ^f3" $NE_LightColorR " ^f0" $NE_LightColorG " ^f1" $NE_LightColorB )
	]
	guibar
	guifreerow  9  1 [ guitext "radius: "
			 ] 64 -2 [ guislider NE_LightRadius 0 512
	]
	guistrut 1
	guilist [// H
		guilist [// V
			guistrut 9 1
			guialign 1 [guitext "color: "]
			guistrut 1
			guialign 1 [guicolor (+ (* (+ (* $NE_LightColorR 256) $NE_LightColorG) 256) $NE_LightColorB); guistrut 1]
		]
		guilist [// V
			guistrut 64 1
			guislider NE_LightColorR 0 255 [NE_LightPreset -1]
			guislider NE_LightColorG 0 255 [NE_LightPreset -1]
			guislider NE_LightColorB 0 255 [NE_LightPreset -1]
		]
	]
	guistrut 0.25
	guilist [// H
		guilist [// V
			guistrut 9 1
		]
		guilist [// V
			guistrut 64 1
			guialign 0 [// H
				guiradio "^f7white "  NE_LightPreset 0 [NE__LightSet 255 255 255]
				guiradio "^f3red "    NE_LightPreset 1 [NE__LightSet 255 192 192]
				guiradio "^f6orange " NE_LightPreset 2 [NE__LightSet 255 224 192]
				guiradio "^f2yellow " NE_LightPreset 3 [NE__LightSet 255 255 192]
				guiradio "^f0green "  NE_LightPreset 4 [NE__LightSet 192 255 192]
				guiradio "^f8cyan "   NE_LightPreset 5 [NE__LightSet 192 255 255]
				guiradio "^f1blue "   NE_LightPreset 6 [NE__LightSet 192 192 255]
				guiradio "^f5violet " NE_LightPreset 7 [NE__LightSet 255 192 255]
			]
			guistrut 0.25
			guialign 0 [// H
				guicheckbox "bright" NE_LightBright 1 0 [if [>= $NE_LightPreset 0] [NE__LightScale]]
			]
		]
	]
	guistrut 1
	guialign 0 [
		guibutton "^f2create" [newent light $NE_LightRadius $NE_LightColorR $NE_LightColorG $NE_LightColorB]
	]
]


NE__Reset = [
	NE_LightPreset 0
	NE_LightBright 1
	NE_LightRadius 128
	NE_LightColorR 255
	NE_LightColorG 255
	NE_LightColorB 255
]

NE__LightSet = [
	NE_LightColorR $arg1
	NE_LightColorG $arg2
	NE_LightColorB $arg3
	if (= $NE_LightBright 0) NE__LightScale
]

NE__LightScale = [
	if (= $NE_LightBright 0) [
		NE_LightColorR (div $NE_LightColorR 2)
		NE_LightColorG (div $NE_LightColorG 2)
		NE_LightColorB (div $NE_LightColorB 2)
	][
		NE_LightColorR (min 255 (* $NE_LightColorR 2))
		NE_LightColorG (min 255 (* $NE_LightColorG 2))
		NE_LightColorB (min 255 (* $NE_LightColorB 2))
	]
]


//##############################################################################################################################################################
//##############################################################################################################################################################
nodebug [
	defvar NE_TelePort_Tag 0 0 10000
	defvar NE_TeleDest_Tag 0 0 10000

	NE_TelePortList = ""
	NE_TeleDestList = ""
]

NE__Teleport = [
	guilist [// H
		guilist [//V
			guistrut 32 1
			guialign 0 [// H
				guititle (concatword "^f2/newent teleport " $NE_TelePort_Tag "^t")
				guistayopen [
					guibutton "" [NE_TelePort_Tag (max (+ $NE_TelePort_Tag -1)     0)] "val_dec"
					guibutton "" [NE_TelePort_Tag (min (+ $NE_TelePort_Tag  1) 10000)] "val_inc"
				]
			]
			guistrut 0.5
			guialign 0 [
				guibutton "create" [newent teleport $NE_TelePort_Tag]
			]
		]
		guibar
		guilist [//V
			guistrut 32 1
			guialign 0 [// H
				guititle (concatword "^f2/newent teledest " $NE_TeleDest_Tag "^t")
				guistayopen [
					guibutton "" [NE_TeleDest_Tag (max (+ $NE_TeleDest_Tag -1)     0)] "val_dec"
					guibutton "" [NE_TeleDest_Tag (min (+ $NE_TeleDest_Tag  1) 10000)] "val_inc"
				]
			]
			guistrut 0.5
			guialign 0 [
				guibutton "create" [newent teledest $NE_TeleDest_Tag]
			]
			guistrut 0.25
		]
	]
	guibar
	guilist [// H
		guilist [//V
			guistrut 32 1
			guititle "teleports"
			guialign 0 [// H
				guistrut 1.5 1
				guistayopen [
					looplist iPort $NE_TelePortList [
						guibutton (concatword " " $iPort " ") [cancelsel; entfind teleport @iPort; gotosel] 0
					]
				]
			]
		]
		guibar
		guilist [//V
			guistrut 32 1
			guititle "destinations"
			guialign 0 [// H
				guistrut 1.5 1
				guistayopen [
					looplist iDest $NE_TeleDestList [
						guibutton (concatword " " $iDest " ") [cancelsel; entfind teledest * @iDest; gotosel] 0
					]
				]
			]
		]
	]
]


NE__GenTeleLists = [
	NE_TelePortList = ""
	NE_TeleDestList = ""
	cancelsel
	entfind *
	entloop [
		cond [=s $enttype "teleport"][ NE_TelePortList = (concat $NE_TelePortList (entattr 0))
		]    [=s $enttype "teledest"][ NE_TeleDestList = (concat $NE_TeleDestList (entattr 1))
		]
	]
	cancelsel

	NE_TelePortList = (sortlist $NE_TelePortList iA iB [naturalsort $iA $iB])
	if (> (listlen $NE_TelePortList) 1) [NE_TelePortList = (listpurgedups $NE_TelePortList)]

	NE_TeleDestList = (sortlist $NE_TeleDestList iA iB [naturalsort $iA $iB])
	if (> (listlen $NE_TeleDestList) 1) [NE_TeleDestList = (listpurgedups $NE_TeleDestList)]

	//  Find first un-used:
	iPort = 0
	while [<= $iPort 255] [
		if [= (listfind NE_TelePortList $iPort) -1] [
			NE_TelePort_Tag $iPort
			iPort = 256 // Break/ExitLoop
		][
			iPort = (+ $iPort 1)
		]
	]
	iDest = 0
	while [<= $iDest 255] [
		if [= (listfind NE_TeleDestList $iDest) -1] [
			NE_TeleDest_Tag $iDest
			iDest = 256 // Break/ExitLoop
		][
			iDest = (+ $iDest 1)
		]
	]
]


