nodebug [
	defvar OPT_Width  1 68 0 // in units of (fontscale Width )
	defvar OPT_Height 1 22 0 // in units of (fontscale Height)
	defvar CustomResX 256 256 8192
    defvar CustomResY 256 256 8192
]

newgui "options" [
	guiscale 0.7
	guikeeptab 1
	// Save the frames 'guitabnum' hack:        H                                V
					  if (= $guitabnum  1) [ guilist [guistrut $OPT_Height 1; guilist [guistrut $OPT_Width 1; OPT__Game   ]] ]
	guitab "console"; if (= $guitabnum  2) [ guilist [guistrut $OPT_Height 1; guilist [guistrut $OPT_Width 1; OPT__Console]] ]
	guitab "hud"    ; if (= $guitabnum  3) [ guilist [guistrut $OPT_Height 1; guilist [guistrut $OPT_Width 1; OPT__Hud    ]] ]
    guitab "input"  ; if (= $guitabnum  4) [ guilist [guistrut $OPT_Height 1; guilist [guistrut $OPT_Width 1; OPT__Input  ]] ]
    guitab "menus"  ; if (= $guitabnum  5) [ guilist [guistrut $OPT_Height 1; guilist [guistrut $OPT_Width 1; OPT__Menus  ]] ]
    guitab "sound"  ; if (= $guitabnum  6) [ guilist [guistrut $OPT_Height 1; guilist [guistrut $OPT_Width 1; OPT__Sound  ]] ]
    guitab "video"  ; if (= $guitabnum  7) [ guilist [guistrut $OPT_Height 1; guilist [guistrut $OPT_Width 1; OPT__Video  ]] ]
    guitab "res"    ; if (= $guitabnum  8) [ guilist [guistrut $OPT_Height 1; guilist [guistrut $OPT_Width 1; OPT__Res    ]] ]
    guitab "gfx"    ; if (= $guitabnum  9) [ guilist [guistrut $OPT_Height 1; guilist [guistrut $OPT_Width 1; OPT__Gfx    ]] ]
	guitab "ext"    ; if (= $guitabnum 10) [ guilist [guistrut $OPT_Height 1; guilist [guistrut $OPT_Width 1; OPT__Ext    ]] ]
  //guitab "cfg"    ; if (= $guitabnum 11) [ guilist [guistrut $OPT_Height 1; guilist [guistrut $OPT_Width 1; OPT__Cfg    ]] ]
] "game" [
    CustomResX = $scr_w
    CustomResY = $scr_h
]


