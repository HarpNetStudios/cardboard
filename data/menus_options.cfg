OPT__Sound = [
	guifreerow 20  1 [ guitext "sound volume: "
			 ] 46 -2 [ guislider soundvol
	]
	guistrut 1
	guifreerow 20  1 [ guitext "simultaneous sounds: "  // "max voices"
			 ] 46 -2 [ guislider soundchans
	]
	guistrut 1
	guifreerow 20  1 [ guitext "sound frequency: "
			 ] 46 -2 [ guilistslider soundfreq [11025 22050 44100 48000]
	]
	guistrut 0.5
	guifreerow 20  1 [ guitext "sound buffer length: "
             ] 46 -2 [ guislider soundbufferlen (getvarmin "soundbufferlen") (getvarmax "soundbufferlen") [soundbufferlen (- $soundbufferlen (mod $soundbufferlen 64))]
                       guialign 1 [guitext (concatword (? (>f (soundbuffermillis) 33.334) "^f3" (? (>f (soundbuffermillis) 16.667) "^f2" "^f9")) (soundbuffermillis) "ms")]
    ]

	guistrut 0.5
    guibar //===================================================================================================================================================
    guistrut 0.5
	guifreerow 20  1 [ guitext "music volume: "
			 ] 46 -2 [ guislider musicvol
	]
	guistrut 0.5
	guifreerow 20  1 [
			 ] 23 -2 [ guicheckbox "show nowplaying" playsong_shownowplaying
			 ] 23 -2 [ if (> $musicvol 0) [guistayopen [guibutton "play next song" playsong]]
	]

	guistrut 0.5
    guibar //===================================================================================================================================================
    guistrut 0.5
    guifreerow 20 -2 [
             ] 46 -2 [ guicheckbox "play sound while minimized" minimizedsounds
    ]
    guistrut 0.5
	guifreerow 20 -2 [
			 ] 46 -2 [ guicheckbox "mumble positional audio" mumble
	]
]

//#############################################################################################################################################
//#############################################################################################################################################
OPT__Video = [
	guistrut 0.25
	guifreerow 18  1 [ guitext "fullscreen: "
			 ]  8 -1 [ guiradio "off"        fullscreen 0
			 ] 11 -1 [ guiradio "fullscreen" fullscreen 1
			 ]  1 -1 [ guiradio "borderless" fullscreen 2
	]

    guistrut 0.5
    guibar //===================================================================================================================================================
	//  Multiples of common monitor refresh rates:
    //      60/120/240 Hz [ 60 120 240 360 480 600 720 840 960 ]
    //              75 Hz [ 75 150 225 300 450 600 900 ]
    //              90 Hz [ 90 180 270 360 540 720 900 ]
    //             144 Hz [    144 288 432 576 720 864 ]
    //             165 Hz [    165 330 495 660 825 990 ]
	guistrut 0.25
    guifreerow 18  1 [ guitext "maxfps: "
             ] 36 -2 [ guilistslider maxfps [60 75 90 120 144 165 240 360 480 540 600 720 840 960]
             ] 12  1 [ guifield maxfps 10
    ]
    guistrut 0.25 //  "menufps" only applies if not in-game (logo with grey background).
    guifreerow 18  1 [ guitext "menufps: "
             ] 36 -2 [ guilistslider menufps [60 75 90 120 144 165 240 360 480 540 600 720 840 960]
             ] 12  1 [ guifield menufps 10
    ]
	guifreerow 18  1 [ guitext "field of view: "
			 ] 36 -2 [ guislider fov;
			 ] 12  0 [ guitext "^f9(default 100)"
	]
	guistrut 0.75
    guifreerow 18 -2 [
             ] 12 -2 [ guicheckbox "vsync" vsync
             ]  1 -2 [ guicheckbox (concatword (? (! $vsync) "^f4") "adaptive") vsynctear
    ]
    //  Adaptive vSync dynamically disables vsync if framerate drops below screen refresh-rate.
    //  For more info:
    //      https://wiki.libsdl.org/SDL2/SDL_GL_SetSwapInterval
    //      https://www.khronos.org/opengl/wiki/Swap_Interval#Adaptive_Vsync

	guistrut 0.5
    guibar //===================================================================================================================================================
    guifreerow 18  1 [ guitext "anti-aliasing: "
             ] 36 -2 [ guinameslider fsaa ["driver" "off" "2x" "4x" "8x" "16x"] [-1 0 2 4 8 16]
    ]

    guistrut 0.5
    guifreerow 18  1 [ guitext "mipmap anisotropy: "
             ] 36 -2 [ guinameslider aniso ["off" "2x" "4x" "8x" "16x"] [0 2 4 8 16]
    ]
    guistrut 0.125
    guifreerow 18 -2 [
             ] 36 -1 [ guicheckbox "trilinear^t^f9(mipmap-level blending)"  trilinear
    ]

    guistrut 0.75
    guifreerow 18  1 [ guitext "texture smoothing: "
             ] 36 -1 [ guicheckbox "bilinear^t^f9(all textures: map, models, text, gui, etc.)"  bilinear
    ]
    guistrut 0.125
    guifreerow 18 -1 [
             ] 36 -1 [ guicheckbox "bilinear^t^f9(map textures only)"  reducefilter
    ]

	guistrut 0.5
    guibar //===================================================================================================================================================
    guifreerow 18  1 [ guitext "^f9horizontal ^f~fov: "
             ] 36 -2 [ guislider fov
             ] 12  0 [ guitext "^f9(default 100)"
    ]
]


//#############################################################################################################################################
//#############################################################################################################################################
macro guiresbutton [ guibutton "%1^f9x^f~%2" "screenres %1 %2" (if (&& (= $scr_w %1) (= $scr_h %2)) [result "radio_on"] [result "radio_off"]) ]

//   1/ 1 = 1
//   5/ 4 = 1.25
//   4/ 3 = 1.333
//   3/ 2 = 1.5
//  16/10 = 1.6
//   5/ 3 = 1.666
//  16/ 9 = 1.777
//  21/ 9 = 2.333
//  32/ 9 = 3.555

OPT__Res = [
	guistayopen [
		guilist [
			guistrut $OPT_Height 1
			guilist [
                guistrut 11.6 1

                guititle "1:1"
                @@@@(guiresbutton  512  512)
                @@@@(guiresbutton  768  768)
                @@@@(guiresbutton 1024 1024)
                @@@@(guiresbutton 1280 1280)
                @@@@(guiresbutton 1536 1536)
                @@@@(guiresbutton 1920 1920)
                @@@@(guiresbutton 2048 2048)
                @@@@(guiresbutton 2560 2560)

                guistrut 1
                guititle "5:4"
                @@@@(guiresbutton  600  480)
                @@@@(guiresbutton 1280 1024)
                @@@@(guiresbutton 1600 1280)
                @@@@(guiresbutton 2560 2048)
            ]

			guibar //===========================================================================================================================================
			guilist [
				guistrut 11.6 1
